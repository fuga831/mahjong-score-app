<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>麻雀点数電卓</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0c2a20">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="点数電卓">
<meta name="description" content="親/子・翻数・アガリの形をタップするだけでロン/ツモの点数をリアルタイム計算する麻雀スコア電卓">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --felt-0:#0c2a20;
    --felt-1:#123a2b;
    --felt-2:#1a4a37;
    --line:#2f5f4a;
    --ivory:#f4eee0;
    --ivory-dim:#cdd9cd;
    --ink:#0f2a20;
    --ink-soft:#9fc2ac;
    --gold:#d8b26a;
    --gold-strong:#e9c983;
    --red:#c14a3d;
    --red-soft:#e0847a;
    --shadow: 0 3px 0 rgba(0,0,0,0.28), 0 6px 14px rgba(0,0,0,0.35);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,0.035) 0, transparent 40%),
      radial-gradient(circle at 80% 85%, rgba(255,255,255,0.03) 0, transparent 45%),
      repeating-linear-gradient(135deg, rgba(255,255,255,0.018) 0 2px, transparent 2px 26px),
      var(--felt-0);
    color:var(--ivory);
    font-family:"Noto Sans JP","Zen Maru Gothic",system-ui,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  .stage{
    max-width:460px;
    margin:0 auto;
    min-height:100vh;
    padding:18px 14px calc(70px + env(safe-area-inset-bottom, 0px));
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  h1{
    font-family:"Zen Maru Gothic",sans-serif;
    font-weight:900;
    font-size:1.05rem;
    letter-spacing:.06em;
    color:var(--gold-strong);
    margin:2px 4px 0;
    display:flex;
    align-items:center;
    gap:.5em;
  }
  h1 .tile{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:1.6em;height:1.6em;
    background:var(--ivory);
    color:var(--ink);
    border-radius:5px;
    font-size:.75em;
    box-shadow:var(--shadow);
  }
  .title-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .title-row h1{margin:2px 0 0;flex:1;min-width:0;}
  .hamburger-btn{
    flex-shrink:0;
    width:34px;height:34px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--felt-1);
    color:var(--ivory);
    font-size:1.05rem;
    line-height:1;
    cursor:pointer;
  }
  .hamburger-btn:active{background:var(--felt-2);}

  /* ---- top control row ---- */
  .toprow{
    display:flex;
    gap:10px;
    align-items:stretch;
  }
  .seg{
    display:flex;
    background:var(--felt-1);
    border:1px solid var(--line);
    border-radius:12px;
    padding:4px;
    gap:4px;
  }
  .seg button{
    flex:1;
    border:0;
    background:transparent;
    color:var(--ink-soft);
    font-family:"Zen Maru Gothic",sans-serif;
    font-weight:700;
    font-size:.92rem;
    padding:9px 14px;
    border-radius:9px;
    cursor:pointer;
    transition:background .15s, color .15s;
  }
  .seg button.active{
    background:var(--gold);
    color:var(--ink);
    box-shadow:0 2px 6px rgba(0,0,0,.3);
  }

  .kiriage{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    background:var(--felt-1);
    border:1px solid var(--line);
    border-radius:12px;
    padding:8px 12px;
    cursor:pointer;
    user-select:none;
  }
  .kiriage .label{
    font-size:.72rem;
    line-height:1.25;
    color:var(--ivory-dim);
  }
  .kiriage .label b{color:var(--ivory);font-weight:500;}
  .switch{
    position:relative;
    width:38px;height:22px;
    border-radius:999px;
    background:var(--felt-2);
    border:1px solid var(--line);
    flex-shrink:0;
    transition:background .15s;
  }
  .switch::after{
    content:"";
    position:absolute;
    top:2px;left:2px;
    width:16px;height:16px;
    border-radius:50%;
    background:var(--ivory-dim);
    transition:transform .15s, background .15s;
  }
  .switch.on{background:#3d7a5c;}
  .switch.on::after{transform:translateX(16px);background:var(--gold-strong);}

  /* ---- result panel ---- */
  .result{
    position:relative;
    background:linear-gradient(180deg, var(--felt-1), var(--felt-2));
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px 18px 14px;
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .result::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:16px;
    padding:1px;
    background:linear-gradient(135deg, rgba(216,178,106,.5), transparent 40%);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
    pointer-events:none;
  }
  .summary-line{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .summary-line .state{
    font-size:.78rem;
    color:var(--ink-soft);
    letter-spacing:.03em;
  }
  .summary-line .state b{
    color:var(--gold-strong);
    font-weight:700;
  }
  .badge{
    font-family:"Zen Maru Gothic",sans-serif;
    font-size:.68rem;
    font-weight:700;
    color:var(--felt-0);
    background:var(--red-soft);
    padding:2px 8px;
    border-radius:999px;
    letter-spacing:.04em;
  }
  .score-rows{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .score-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 4px 8px 2px;
  }
  .score-row + .score-row{
    border-top:1px dashed var(--line);
  }
  .score-row .tag{
    display:flex;
    flex-direction:column;
    gap:1px;
    font-family:"Zen Maru Gothic",sans-serif;
    font-weight:700;
    font-size:.85rem;
    color:var(--ivory-dim);
    width:4.6em;
    flex-shrink:0;
  }
  .score-row .tag .fusub{
    font-family:"Noto Sans JP",sans-serif;
    font-weight:500;
    font-size:.62rem;
    color:#7c9d8b;
    letter-spacing:0;
  }
  .score-row .amt{
    font-family:"Zen Maru Gothic",sans-serif;
    font-weight:900;
    font-variant-numeric:tabular-nums;
    color:var(--ivory);
    font-size:1.9rem;
    line-height:1;
    text-align:right;
    flex:1;
  }
  .score-row .amt .pt{
    font-size:.95rem;
    font-weight:700;
    color:var(--ink-soft);
    margin-left:.15em;
  }
  .score-row .amt .all{
    font-size:.8rem;
    font-weight:700;
    color:var(--gold-strong);
    margin-left:.35em;
  }
  .split{
    display:flex;
    gap:14px;
    justify-content:flex-end;
    align-items:baseline;
  }
  .split .item{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:1px;
  }
  .split .item .who{
    font-size:.62rem;
    color:var(--ink-soft);
    letter-spacing:.05em;
  }
  .split .item .num{
    font-family:"Zen Maru Gothic",sans-serif;
    font-weight:900;
    font-variant-numeric:tabular-nums;
    font-size:1.25rem;
    color:var(--ivory);
  }
  .row-ron .amt{color:var(--red-soft);}

  /* ---- section blocks ---- */
  section{
    background:var(--felt-1);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px 12px 13px;
    transition:opacity .15s;
  }
  section.disabled{
    opacity:.4;
    pointer-events:none;
  }
  section .sec-title{
    font-size:.7rem;
    font-weight:700;
    color:var(--ink-soft);
    letter-spacing:.06em;
    margin-bottom:9px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .sec-title .hint{
    font-weight:400;
    color:#7c9d8b;
  }
  .sec-title .fu-mode-link{
    cursor:pointer;
    text-decoration:underline;
    color:var(--gold-strong);
  }

  .grid{
    display:grid;
    gap:7px;
  }
  .grid.g4{grid-template-columns:repeat(4,1fr);}
  .grid.g5{grid-template-columns:repeat(3,1fr);}
  .grid.g2{grid-template-columns:repeat(2,1fr);}

  .tile-btn{
    font-family:"Zen Maru Gothic",sans-serif;
    font-weight:700;
    font-size:.86rem;
    color:var(--ink);
    background:var(--ivory);
    border:1.5px solid transparent;
    border-radius:9px;
    padding:11px 6px;
    text-align:center;
    cursor:pointer;
    box-shadow:0 2px 0 rgba(0,0,0,.25);
    line-height:1.25;
    transition:transform .08s, background .12s, box-shadow .12s;
  }
  .tile-btn small{display:block;font-size:.65rem;font-weight:500;color:#5a6b60;margin-top:1px;}
  .tile-btn:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(0,0,0,.25);}
  .tile-btn.selected{
    background:var(--gold);
    border-color:var(--gold-strong);
    box-shadow:0 2px 0 rgba(0,0,0,.3), 0 0 0 2px rgba(216,178,106,.25);
  }
  .tile-btn.selected small{color:#5a4523;}
  .tile-btn.disabled{
    opacity:.35;
    cursor:not-allowed;
    pointer-events:none;
  }
  .tile-btn.tier{background:var(--felt-2);color:var(--ivory);}
  .tile-btn.tier small{color:var(--ink-soft);}
  .tile-btn.tier.selected{background:var(--red);color:var(--ivory);border-color:var(--red-soft);}
  .tile-btn.tier.selected small{color:#f2d4cf;}

  .chip-row{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
  }
  .chip{
    font-family:"Noto Sans JP",sans-serif;
    font-weight:500;
    font-size:.78rem;
    color:var(--ivory-dim);
    background:var(--felt-2);
    border:1.5px solid var(--line);
    border-radius:999px;
    padding:8px 13px;
    cursor:pointer;
    transition:all .12s;
  }
  .chip .fu{font-weight:700;color:var(--gold-strong);margin-left:.3em;}
  .chip.on{
    background:var(--gold);
    border-color:var(--gold-strong);
    color:var(--ink);
  }
  .chip.on .fu{color:#5a4523;}
  .chip.disabled{opacity:.35;cursor:not-allowed;pointer-events:none;}

  /* ---- mentsu (triplet / kan) list ---- */
  .mentsu-list{
    display:flex;
    flex-direction:column;
    gap:7px;
    margin-top:9px;
  }
  .mentsu-empty{
    font-size:.72rem;
    color:#7c9d8b;
  }
  .mentsu-row{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:6px;
    background:var(--felt-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:7px 8px;
  }
  .mseg{
    display:flex;
    background:var(--felt-1);
    border-radius:7px;
    padding:2px;
    gap:2px;
  }
  .mseg button{
    border:0;
    background:transparent;
    color:var(--ink-soft);
    font-family:"Noto Sans JP",sans-serif;
    font-weight:500;
    font-size:.68rem;
    padding:5px 8px;
    border-radius:5px;
    cursor:pointer;
    white-space:nowrap;
  }
  .mseg button.active{background:var(--gold);color:var(--ink);font-weight:700;}
  .mentsu-row .mfu{
    margin-left:auto;
    font-family:"Zen Maru Gothic",sans-serif;
    font-weight:900;
    color:var(--gold-strong);
    font-size:.85rem;
    padding-left:4px;
  }
  .mentsu-row .mremove{
    width:22px;height:22px;
    flex-shrink:0;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--felt-1);
    color:var(--ivory-dim);
    font-size:.78rem;
    line-height:1;
    cursor:pointer;
  }
  .mentsu-row .mremove:active{background:var(--felt-0);}
  .mentsu-add{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    width:100%;
    margin-top:8px;
    padding:9px;
    border-radius:10px;
    border:1.5px dashed var(--line);
    background:transparent;
    color:var(--ink-soft);
    font-family:"Noto Sans JP",sans-serif;
    font-weight:500;
    font-size:.8rem;
    cursor:pointer;
  }
  .mentsu-add:active{background:var(--felt-2);}
  .mentsu-add.disabled{opacity:.35;pointer-events:none;}

  .shanpon-note{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    background:var(--felt-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:8px 10px;
    margin-top:7px;
  }
  .shanpon-note .lbl{font-size:.75rem;color:var(--ivory-dim);}
  .shanpon-note .note{
    width:100%;
    font-size:.68rem;
    color:#7c9d8b;
  }

  footer{
    text-align:center;
    font-size:.65rem;
    color:#5f8570;
    margin-top:2px;
    letter-spacing:.03em;
  }

  #calcTab, #logTab{
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  /* ---- bottom nav ---- */
  .bottom-nav{
    position:fixed;
    left:0; right:0; bottom:0;
    display:flex;
    gap:8px;
    padding:8px 14px calc(8px + env(safe-area-inset-bottom, 0px));
    background:linear-gradient(180deg, rgba(12,42,32,.85), var(--felt-0) 30%);
    border-top:1px solid var(--line);
    backdrop-filter:blur(6px);
    z-index:20;
  }
  .bottom-nav button{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    border:0;
    background:transparent;
    color:var(--ink-soft);
    font-family:"Zen Maru Gothic",sans-serif;
    font-weight:700;
    font-size:.68rem;
    padding:8px 4px 6px;
    border-radius:12px;
    cursor:pointer;
  }
  .bottom-nav button .ic{font-size:1.2rem;line-height:1;}
  .bottom-nav button.active{background:var(--felt-1);color:var(--gold-strong);}

  /* ---- sticky totals header (log tab) ---- */
  .sticky-header{
    position:sticky;
    top:0;
    z-index:10;
    margin:0 -14px;
    padding:10px 14px 12px;
    background:linear-gradient(180deg, var(--felt-0) 70%, rgba(12,42,32,0));
  }
  /* 演出モードの発表中/発表後は、順位カードが積み重なって縦に長くなり得るため
     sticky化すると下のフォーム等を覆い隠してしまう。この状態だけは通常の
     ブロックとして扱い、スクロールで自然に流れていくようにする。 */
  .header-block{
    margin:0 -14px;
    padding:10px 14px 12px;
    background:linear-gradient(180deg, var(--felt-0) 70%, rgba(12,42,32,0));
  }
  .total-cards{
    display:grid;
    grid-auto-flow:column;
    grid-auto-columns:minmax(84px,1fr);
    gap:7px;
    overflow-x:auto;
    padding-bottom:2px;
  }
  .total-card{
    background:var(--felt-1);
    border:1px solid var(--line);
    border-radius:12px;
    padding:8px 9px;
    box-shadow:var(--shadow);
  }
  .total-card.top{background:linear-gradient(160deg, var(--felt-2), var(--felt-1));border-color:var(--gold);}
  .total-card .pname{
    font-size:.68rem;
    font-weight:700;
    color:var(--ivory-dim);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    display:flex;
    align-items:center;
    gap:3px;
  }
  .total-card.top .pname{color:var(--gold-strong);}
  .total-card .pmoney{
    font-family:"Zen Maru Gothic",sans-serif;
    font-weight:900;
    font-variant-numeric:tabular-nums;
    font-size:1.05rem;
    color:var(--ivory);
    margin-top:2px;
    white-space:nowrap;
  }
  .total-card .ppt{
    font-size:.62rem;
    color:var(--ink-soft);
    font-variant-numeric:tabular-nums;
  }
  .crown{font-size:.7rem;}

  /* ---- 演出モード切り替えスイッチ（画面右上） ---- */
  .mode-switch-row{
    display:flex;
    justify-content:flex-end;
    align-items:center;
    gap:6px;
    padding-bottom:8px;
  }
  .mode-switch-row .mode-label{
    font-size:.66rem;
    color:var(--ink-soft);
    letter-spacing:.02em;
  }

  /* ---- 演出モード：終局ボタン・順位発表 ---- */
  .reveal-btn{
    display:block;
    width:100%;
    font-family:"Zen Maru Gothic",sans-serif;
    font-weight:900;
    font-size:.95rem;
    color:var(--ink);
    background:linear-gradient(160deg, var(--gold-strong), var(--gold));
    border:1.5px solid var(--gold-strong);
    border-radius:12px;
    padding:13px;
    cursor:pointer;
    box-shadow:var(--shadow);
  }
  .reveal-btn:active{transform:translateY(1px);}
  .reveal-area{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:10px;
  }
  .reveal-card{
    background:linear-gradient(180deg, var(--felt-1), var(--felt-2));
    border:1px solid var(--line);
    border-radius:14px;
    padding:10px 14px;
    box-shadow:var(--shadow);
    animation:reveal-pop .25s ease-out;
  }
  .reveal-card.top{border-color:var(--gold);background:linear-gradient(180deg, #2a4a35, var(--felt-2));}
  @keyframes reveal-pop{
    from{opacity:0;transform:scale(.92) translateY(4px);}
    to{opacity:1;transform:scale(1) translateY(0);}
  }
  .reveal-rank{
    font-family:"Zen Maru Gothic",sans-serif;
    font-weight:900;
    font-size:.78rem;
    color:var(--gold-strong);
    letter-spacing:.04em;
    margin-bottom:4px;
  }
  .reveal-card.top .reveal-rank{font-size:.9rem;}
  .reveal-member{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:8px;
    padding:3px 0;
  }
  .reveal-name{
    font-weight:700;
    font-size:.9rem;
    color:var(--ivory);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .reveal-money{
    font-family:"Zen Maru Gothic",sans-serif;
    font-weight:900;
    font-variant-numeric:tabular-nums;
    font-size:1.15rem;
    color:var(--ivory);
    flex-shrink:0;
  }
  .reveal-pt{
    font-size:.66rem;
    color:var(--ink-soft);
    font-variant-numeric:tabular-nums;
    flex-shrink:0;
  }
  .reveal-done{
    text-align:center;
    font-size:.72rem;
    color:var(--ink-soft);
    padding:4px 0 2px;
  }

  .share-icon-btn{
    border:1px solid var(--line);
    background:var(--felt-1);
    color:var(--ivory-dim);
    border-radius:8px;
    width:26px;height:26px;
    font-size:.78rem;
    line-height:1;
    cursor:pointer;
    margin-right:auto;
  }
  .share-icon-btn:active{background:var(--felt-2);}

  /* ---- 対局を終了する ---- */
  .end-match-btn{
    display:block;
    width:100%;
    margin-top:9px;
    font-family:"Zen Maru Gothic",sans-serif;
    font-weight:700;
    font-size:.82rem;
    color:var(--ivory-dim);
    background:transparent;
    border:1.5px solid var(--line);
    border-radius:12px;
    padding:10px;
    cursor:pointer;
  }
  .end-match-btn:active{background:var(--felt-1);}
  .end-match-confirm{
    margin-top:9px;
    background:var(--felt-1);
    border:1px solid var(--red);
    border-radius:12px;
    padding:10px 12px;
    display:flex;
    flex-direction:column;
    gap:8px;
    font-size:.76rem;
    color:var(--ivory-dim);
  }
  .end-match-confirm-btns{display:flex;gap:8px;}
  .end-match-confirm-btns .preset-btn{flex:1;}
  .preset-btn.danger{background:var(--red);color:var(--ivory);border-color:var(--red-soft);}

<script>
/* =========================================================================
   MahjongScore module — pure calculation logic.
   (In a full project this would live in utils/mahjongScore.ts, independent
   of the UI below, so it can be unit tested on its own.)
   ========================================================================= */
const HAN_TIER_INFO = {
  mangan:     { minHan: 5,  name: '満貫',   sub: '5翻' },
  haneman:    { minHan: 6,  name: '跳満',   sub: '6〜7翻' },
  baiman:     { minHan: 8,  name: '倍満',   sub: '8〜10翻' },
  sanbaiman:  { minHan: 11, name: '三倍満', sub: '11〜12翻' },
  yakuman:    { minHan: 13, name: '役満',   sub: '13翻〜' },
};

function roundUpTo(n, unit){ return Math.ceil(n / unit) * unit; }

// Fu (符) calculation from the simplified UI state.
// Base fu is always built additively — 20(副底) + the situational bonus for
// how the hand was completed — and rounded up only once, at the very end.
const FU_BASE = 20;
const FU_MENZEN_RON_BONUS = 10; // only when the hand is closed AND won by ron
const FU_TSUMO_BONUS = 2;       // whenever won by tsumo, open or closed

// One 刻子(triplet) or 槓(kan) set's fu, from its three independent traits.
// 刻子・明・中張 = 2 is the unit value; 暗(concealed) doubles it, 幺九牌(1/9/字)
// doubles it again, and 槓(kan) multiplies the whole thing by 4.
// This single formula reproduces all 8 official values:
//   明刻2-8=2  明刻19字=4   暗刻2-8=4  暗刻19字=8
//   明槓2-8=8  明槓19字=16  暗槓2-8=16 暗槓19字=32
function mentsuFu(m){
  return 2 * (m.ankou ? 2 : 1) * (m.terminal ? 2 : 1) * (m.isKan ? 4 : 1);
}

// シャンポン待ち (shanpon wait) special case: the wait itself is worth 0 fu,
// but the pair that actually completes into a triplet is scored as a
// minko(明刻) if won by ron (the winning tile came from someone's discard,
// just like a call) and as an ankou(暗刻) if won by tsumo (self-drawn).
// So the same shanpon pair contributes a *different* fu depending on ron vs
// tsumo — this is the one case where a hand's ron-fu and tsumo-fu genuinely
// diverge beyond the usual +10/+2 base difference.
function shanponRonFu(terminal){ return terminal ? 4 : 2; }   // = minko value
function shanponTsumoFu(terminal){ return terminal ? 8 : 4; } // = ankou value

// calcFuPair(state) -> { fuRon, fuTsumo } computed independently, because a
// hand's fu is not always the same for both winning methods (menzen-ron
// bonus only applies to ron; tsumo bonus only applies to tsumo; and a
// shanpon-completed set flips between minko/ankou — see above).
function calcFuPair(s){
  if (s.keitai === 'chiitoitsu') return { fuRon: 25, fuTsumo: 25 };
  if (s.keitai === 'pinfu')      return { fuRon: 30, fuTsumo: 20 }; // pinfu locks both fixed values

  const isClosed = s.keitai !== 'naki';
  const waitBonus = s.machi === 'bad' ? 2 : 0; // ryanmen and shanpon both add 0 here
  const shared = waitBonus + (s.yakuhaiHead?2:0) + s.mentsuList.reduce((sum, m) => sum + mentsuFu(m), 0);
  const shanponRon = s.machi === 'shanpon' ? shanponRonFu(s.shanponTerminal) : 0;
  const shanponTsumo = s.machi === 'shanpon' ? shanponTsumoFu(s.shanponTerminal) : 0;

  let fuRon = roundUpTo(FU_BASE + (isClosed ? FU_MENZEN_RON_BONUS : 0) + shared + shanponRon, 10);
  let fuTsumo = roundUpTo(FU_BASE + FU_TSUMO_BONUS + shared + shanponTsumo, 10);

  // 鳴きで加符が何も無い形（いわゆる喰い平和形）は20符になってしまうが、
  // 実戦のルールでは30符が最低ラインとして扱われる。
  if (!isClosed) {
    fuRon = Math.max(fuRon, 30);
    fuTsumo = Math.max(fuTsumo, 30);
  }
  return { fuRon, fuTsumo };
}

// calcBase(han, fu, isKiriageMangan) -> the 基本点(A) for one han/fu pair.
function calcBase(han, fu, isKiriageMangan){
  let base;
  let cappedToMangan = false;
  if (han >= 13)      base = 8000;
  else if (han >= 11) base = 6000;
  else if (han >= 8)  base = 4000;
  else if (han >= 6)  base = 3000;
  else if (han >= 5)  base = 2000;
  else {
    base = fu * Math.pow(2, han + 2);
    if (base > 2000) { base = 2000; cappedToMangan = true; }
    else if (isKiriageMangan && base >= 1920 && base < 2000) { base = 2000; cappedToMangan = true; }
  }
  return { base, cappedToMangan };
}

// calcScore(isDealer, han, fuRon, fuTsumo, isKiriageMangan) -> pure, no UI
// dependency. Ron and Tsumo each get their own 基本点 because fuRon and
// fuTsumo can differ (see calcFuPair).
function calcScore(isDealer, han, fuRon, fuTsumo, isKiriageMangan){
  const ronBase = calcBase(han, fuRon, isKiriageMangan);
  const tsumoBase = calcBase(han, fuTsumo, isKiriageMangan);
  const ron = isDealer ? roundUpTo(ronBase.base * 6, 100) : roundUpTo(ronBase.base * 4, 100);
  const tsumo = isDealer
    ? { all: roundUpTo(tsumoBase.base * 2, 100) }
    : { fromDealer: roundUpTo(tsumoBase.base * 2, 100), fromNonDealer: roundUpTo(tsumoBase.base * 1, 100) };
  return { ron, tsumo, ronCapped: ronBase.cappedToMangan, tsumoCapped: tsumoBase.cappedToMangan };
}

/* =========================================================================
   ScoreSheet module — pure settlement logic for the 得点記録票 tab.
   (Would live in utils/scoreSheet.ts alongside mahjongScore.ts.)
   ========================================================================= */

// Rounds |x| (x is in units of "hundreds of raw points") to the nearest 10,
// i.e. rounds the raw score to the nearest 1000 (=1pt), per the chosen
// convention, then restores the sign so negative diffs round symmetrically.
function roundTensDigit(x, mode) {
  const sign = x < 0 ? -1 : 1;
  const abs = Math.abs(x);
  const tens = Math.floor(abs / 10) * 10;
  const rem = abs - tens;
  let roundedAbs;
  if (mode === 'floor') roundedAbs = tens;                       // 切り捨て
  else if (mode === 'roundHalfUp') roundedAbs = rem >= 5 ? tens + 10 : tens; // 四捨五入
  else roundedAbs = rem >= 6 ? tens + 10 : tens;                  // 五捨六入(default)
  return sign * roundedAbs;
}

// diffRaw: (素点 - 返し点). Returns the result in pt (1pt = 1000点).
function applyRounding(diffRaw, mode) {
  const hundreds = Math.round(diffRaw / 100);
  return roundTensDigit(hundreds, mode) / 10;
}

// entries: [{name, score}] -> same array with loRank/hiRank/tieCount added.
// Ties share the same [loRank,hiRank] band so uma/oka can be split evenly.
function rankPlayers(entries) {
  const sorted = [...entries].sort((a, b) => b.score - a.score);
  const result = [];
  let i = 0;
  while (i < sorted.length) {
    let j = i;
    while (j + 1 < sorted.length && sorted[j + 1].score === sorted[i].score) j++;
    for (let k = i; k <= j; k++) {
      result.push({ ...sorted[k], loRank: i + 1, hiRank: j + 1, tieCount: j - i + 1 });
    }
    i = j + 1;
  }
  return result;
}

function umaForExactRank(rank, uma, playerCount) {
  if (playerCount === 3) {
    const [C] = uma;
    if (rank === 1) return C;
    if (rank === 2) return 0;
    return -C;
  }
  const [A, B] = uma;
  if (rank === 1) return B;
  if (rank === 2) return A;
  if (rank === 3) return -A;
  return -B;
}
// Averages the uma of every integer rank spanned by a tie so a tied group
// splits it evenly (works for 2-way, 3-way, or all-4-tied groups alike).
function umaForTieGroup(loRank, hiRank, uma, playerCount) {
  let sum = 0, count = 0;
  for (let r = loRank; r <= hiRank; r++) { sum += umaForExactRank(r, uma, playerCount); count++; }
  return sum / count;
}

// calcHanchanResult(hanchan, settings) -> { pt: {name: ptDelta}, ranked }
// pt is this hanchan's own contribution only (not a running total).
function calcHanchanResult(hanchan, settings) {
  const { players, startPoints, returnPoints, playerCount, umaEnabled, uma,
          tobiEnabled, tobiPoints, tobiRecipient } = settings;
  const entries = players.map(p => ({ name: p, score: hanchan.scores[p] }));
  const ranked = rankPlayers(entries);
  const oka = (returnPoints - startPoints) * playerCount / 1000;
  const topGroup = ranked.filter(r => r.loRank === 1);

  const pt = {};
  players.forEach(p => { pt[p] = 0; });

  ranked.forEach(r => {
    pt[r.name] += applyRounding(r.score - returnPoints, settings.roundingMode);
    if (umaEnabled) pt[r.name] += umaForTieGroup(r.loRank, r.hiRank, uma, playerCount);
    if (r.loRank === 1) pt[r.name] += oka / topGroup.length;
  });

  if (tobiEnabled) {
    players.forEach(p => {
      if (hanchan.scores[p] < 0) {
        pt[p] -= tobiPoints;
        if (tobiRecipient === 'buster' && hanchan.busterOf && hanchan.busterOf[p]) {
          pt[hanchan.busterOf[p]] += tobiPoints;
        } else {
          topGroup.forEach(r => { pt[r.name] += tobiPoints / topGroup.length; });
        }
      }
    });
  }

  return { pt, ranked };
}

// calcTotals(hanchans, chips, settings) -> per-player running pt/yen totals.
function calcTotals(hanchans, chips, settings) {
  const totals = {};
  settings.players.forEach(p => { totals[p] = 0; });
  hanchans.forEach(h => {
    const { pt } = calcHanchanResult(h, settings);
    settings.players.forEach(p => { totals[p] += pt[p]; });
  });
  const chipSum = settings.players.reduce((s, p) => s + (chips[p] || 0), 0);
  const money = {};
  settings.players.forEach(p => {
    money[p] = totals[p] * settings.rate + (chips[p] || 0) * settings.chipUnitYen;
  });
  return { pt: totals, money, chipImbalance: chipSum !== 0, chipSum };
}

const state = {
  isDealer: false,
  kiriageMangan: true,
  hanTier: 3,      // 1 | 2 | 3 | 4 | 'mangan' | 'haneman' | 'baiman' | 'sanbaiman' | 'yakuman'
  keitai: 'menzen', // 'menzen' | 'naki' | 'pinfu' | 'chiitoitsu'
  machi: 'ryanmen', // 'ryanmen' | 'bad' | 'shanpon'
  shanponTerminal: false, // only used when machi==='shanpon'
  yakuhaiHead: false,
  mentsuList: [], // { id, ankou:bool(暗/明), terminal:bool(1・9・字/中張), isKan:bool(槓/刻子) } — excludes the shanpon set
  fuDirectMode: false, // 中級者・上級者向け: 符数を直接入力するモード
  manualFu: 30,
};
let mentsuSeq = 1;

// 別のボタンへのタップが、テキスト入力のonchange(blur)によるDOM作り直しと
// 同じ一連の操作の中で競合して消えてしまうのを防ぐため、render()も
// （得点記録タブのrenderAppと同様に）1フレームだけ遅らせて呼び出す。
let _renderQueued = false;
function scheduleRender(){
  if (_renderQueued) return;
  _renderQueued = true;
  requestAnimationFrame(() => { _renderQueued = false; render(); });
}

function setDealer(v){ state.isDealer = v; scheduleRender(); }
function toggleKiriage(){ state.kiriageMangan = !state.kiriageMangan; scheduleRender(); }
function toggleFuDirectMode(){ state.fuDirectMode = !state.fuDirectMode; scheduleRender(); }
function setManualFu(v){ state.manualFu = Math.max(0, v); scheduleRender(); }
// 符は常に10の位に切り上げ（七対子の25符だけ例外）というルールを、
// 直接入力された値にも適用する。
function normalizeManualFu(v){ return v === 25 ? 25 : roundUpTo(v, 10); }

function selectHanTier(tier){
  state.hanTier = tier;
  scheduleRender();
}

function selectKeitai(k){
  if (state.hanTier !== 1 && state.hanTier !== 2 && state.hanTier !== 3 && state.hanTier !== 4) return;
  state.keitai = k;
  // 七対子は役だけで2翻あるため1翻はあり得ない（ピンフはロンなら1翻もあり得るので制限しない）
  if (k === 'chiitoitsu' && state.hanTier === 1) state.hanTier = 2;

}

function toggleChip(name){
  state[name] = !state[name];
  scheduleRender();
}
function setMachi(key){ state.machi = key; scheduleRender(); }
function setShanponTerminal(v){ state.shanponTerminal = v; scheduleRender(); }

const MAX_MENTSU = 4; // a hand has at most 4 sets besides the pair
function addMentsu(){

  state.mentsuList.push({ id: mentsuSeq++, ankou: true, terminal: false, isKan: false });

}
function setMentsuField(id, field, value){
  const m = state.mentsuList.find(x => x.id === id);

}
function removeMentsu(id){
  state.mentsuList = state.mentsuList.filter(x => x.id !== id);

        </div>
        <span class="note">※ロンなら明刻扱い(+${shanponRonFu(state.shanponTerminal)}符)、ツモなら暗刻扱い(+${shanponTsumoFu(state.shanponTerminal)}符)。この組は下の「刻子・槓」に追加不要です。</span>

    return `<div class="chip ${on?'on':''} ${dis?'disabled':''}" onclick="toggleChip('${key}')">${label}<span class="fu">${fu}</span></div>`;

      <div class="mentsu-row">
        <div class="mseg">
          <button class="${!m.ankou?'active':''}" onclick="setMentsuField(${m.id},'ankou',false)">明</button>

          <button class="${!m.isKan?'active':''}" onclick="setMentsuField(${m.id},'isKan',false)">刻子</button>
          <button class="${m.isKan?'active':''}" onclick="setMentsuField(${m.id},'isKan',true)">槓</button>
        </div>
        <div class="mseg">
          <button class="${!m.terminal?'active':''}" onclick="setMentsuField(${m.id},'terminal',false)">中張</button>

  // ---- result ----
  const panel = document.getElementById('resultPanel');
  if (!keitaiActive) {
    const info = HAN_TIER_INFO[state.hanTier];
    const r = calcScore(state.isDealer, info.minHan, 0, 0, state.kiriageMangan);
    panel.innerHTML = resultHtml(`${info.name}（${info.sub}）`, null, null, r);
  } else {
    const { fuRon, fuTsumo } = state.fuDirectMode
      ? (() => { const f = normalizeManualFu(state.manualFu); return { fuRon: f, fuTsumo: f }; })()
      : calcFuPair(state);
    const r = calcScore(state.isDealer, state.hanTier, fuRon, fuTsumo, state.kiriageMangan);
    const ronFuLabel = r.ronCapped ? `${fuRon}符→満貫` : `${fuRon}符`;
    const tsumoFuLabel = r.tsumoCapped ? `${fuTsumo}符→満貫` : `${fuTsumo}符`;
    panel.innerHTML = resultHtml(`${state.hanTier}翻`, ronFuLabel, tsumoFuLabel, r);
  }
}

function resultHtml(stateLabel, ronFuLabel, tsumoFuLabel, r){
  const tsumoHtml = r.tsumo.all !== undefined
    ? `<span class="pt">${fmt(r.tsumo.all)}</span><span class="all">ALL</span>`
    : `<span class="split">
         <span class="item"><span class="who">子から</span><span class="num">${fmt(r.tsumo.fromNonDealer)}</span></span>
         <span class="item"><span class="who">親から</span><span class="num">${fmt(r.tsumo.fromDealer)}</span></span>
       </span>`;
  return `
    <div class="summary-line">
      <span class="state">現在: <b>${stateLabel}</b></span>
    </div>
    <div class="score-rows">
      <div class="score-row row-ron">
        <span class="tag">ロン${ronFuLabel ? `<span class="fusub">${ronFuLabel}</span>` : ''}</span>
        <span class="amt">${fmt(r.ron)}<span class="pt">点</span></span>
      </div>
      <div class="score-row row-tsumo">
        <span class="tag">ツモ${tsumoFuLabel ? `<span class="fusub">${tsumoFuLabel}</span>` : ''}</span>
        <span class="amt">${tsumoHtml}</span>
      </div>
    </div>
  `;
}

// 保存されているデータ(v2、無ければ旧v1)をパースしてdefaultLogState()にマージする、
// v1/v2共通の下地処理。matchHistoryはv1データに存在しないため自然に[]で補完される。
function mergeParsedLogState(parsed){
  const base = defaultLogState();
  return {
    ...base,
    ...parsed,
    settings: { ...base.settings, ...(parsed.settings || {}) },
    matchHistory: Array.isArray(parsed.matchHistory) ? parsed.matchHistory : [],
    ui: base.ui, // 開閉状態・入力途中のフォームは復元しない
  };
}

function loadLogState(){
  try {
    const raw = localStorage.getItem(LOG_STORAGE_KEY);
    if (raw) return mergeParsedLogState(JSON.parse(raw));
    // v2キーが無ければ旧v1キーを探し、あれば読み替えて移行する（matchHistoryは[]で補完）。
    const rawV1 = localStorage.getItem(LOG_STORAGE_KEY_V1);
    if (rawV1) return mergeParsedLogState(JSON.parse(rawV1));
    return defaultLogState();
  } catch (e) {
    return defaultLogState(); // localStorageが使えない環境でもメモリ上で動く
  }
}

function saveLogState(){
  try {
    const { settings, hanchans, chips, hanchanSeq, currentMatchStartedAt, matchHistory } = logState;
    localStorage.setItem(LOG_STORAGE_KEY, JSON.stringify({ settings, hanchans, chips, hanchanSeq, currentMatchStartedAt, matchHistory }));
  } catch (e) { /* 保存できない環境ではメモリ上のみで継続 */ }
}

function renamePlayerEverywhere(oldName, newName){
  if (oldName === newName) return;
  logState.hanchans.forEach(h => {
    if (Object.prototype.hasOwnProperty.call(h.scores, oldName)) {
      h.scores[newName] = h.scores[oldName];
      delete h.scores[oldName];
    }
    if (h.busterOf) {
      Object.keys(h.busterOf).forEach(k => { if (h.busterOf[k] === oldName) h.busterOf[k] = newName; });
      if (Object.prototype.hasOwnProperty.call(h.busterOf, oldName)) {
        h.busterOf[newName] = h.busterOf[oldName];
        delete h.busterOf[oldName];
      }
    }
  });
  if (Object.prototype.hasOwnProperty.call(logState.chips, oldName)) {
    logState.chips[newName] = logState.chips[oldName];
    delete logState.chips[oldName];
  }
  [logState.ui.formScores, logState.ui.formBuster].forEach(obj => {
    Object.keys(obj).forEach(k => { if (obj[k] === oldName) obj[k] = newName; });
    if (Object.prototype.hasOwnProperty.call(obj, oldName)) {
      obj[newName] = obj[oldName];
      delete obj[oldName];
    }
  });
}
function setPlayerName(i, value){

function setChipUnitYen(v){ logState.settings.chipUnitYen = v; saveLogState(); scheduleRenderApp(); }
function toggleAccordion(key){ logState.ui[key] = !logState.ui[key]; scheduleRenderApp(); }

/* ---- 演出モード（終局まで順位・収支を隠す） ---- */
function togglePresentationMode(){
  logState.settings.presentationMode = !logState.settings.presentationMode;
  logState.ui.revealActive = false;
  logState.ui.revealStep = 0;
  logState.ui.confirmEndMatch = false;
  saveLogState(); scheduleRenderApp();
}
// 発表順は「2位→3位→…→1位」。1位（優勝）を最後にとっておくことで、
// 途中の順位から先に発表して最後に一番の見せ場を持ってくる演出。
function revealOrderFor(playerCount){
  return playerCount === 3 ? [2, 3, 1] : [2, 3, 4, 1];
}
function startReveal(){
  logState.ui.revealActive = true;
  logState.ui.revealStep = 1; // 「終局」を押した瞬間に最初の順位（2位）まで発表する
  scheduleRenderApp();
}
function revealNext(totalGroups){
  if (logState.ui.revealStep < totalGroups) logState.ui.revealStep++;
  scheduleRenderApp();
}

/* ---- 対局を終了する（現在の進行中対局をmatchHistoryへアーカイブしてリセット） ---- */
function requestEndMatch(){
  if (logState.hanchans.length === 0) return;
  logState.ui.confirmEndMatch = true;
  scheduleRenderApp();
}
function cancelEndMatch(){
  logState.ui.confirmEndMatch = false;
  scheduleRenderApp();
}
function confirmEndMatch(){
  logState.ui.confirmEndMatch = false;
  archiveCurrentMatch();
}
// 進行中のhanchans/chips/settingsをスナップショットとしてmatchHistoryへ保存し、
// 進行中データ(hanchans/chips/hanchanSeq/演出状態)だけをリセットする。
// settingsは次の対局にそのまま引き継ぐため、ここではリセットしない。
function archiveCurrentMatch(){
  if (logState.hanchans.length === 0) return;
  const entry = {
    id: 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
    startedAt: logState.currentMatchStartedAt || new Date().toISOString(),
    endedAt: new Date().toISOString(),
    title: '',
    settingsSnapshot: JSON.parse(JSON.stringify(logState.settings)),
    hanchans: JSON.parse(JSON.stringify(logState.hanchans)),
    chips: JSON.parse(JSON.stringify(logState.chips)),
  };
  logState.matchHistory.unshift(entry);
  logState.hanchans = [];
  logState.chips = {};
  logState.hanchanSeq = 1;
  logState.currentMatchStartedAt = null;
  logState.ui.revealActive = false;
  logState.ui.revealStep = 0;
  logState.ui.confirmEndMatch = false;
  cancelEditHanchan_noRender();
  saveLogState();
  scheduleRenderApp();
}
// cancelEditHanchan()相当だがscheduleRenderAppを二重に呼ばないための内部版
function cancelEditHanchan_noRender(){
  logState.ui.editingHanchanId = null;
  resetFormScores();
}

/* ---- hanchan form handlers ---- */
function setFormScore(name, value){ logState.ui.formScores[name] = value; scheduleRenderApp(); }
function setFormBuster(bustedName, busterName){ logState.ui.formBuster[bustedName] = busterName; scheduleRenderApp(); }

function formTotal(){
  return activePlayers().reduce((sum, p) => sum + (parseInt(logState.ui.formScores[p], 10) || 0), 0);
}
function formIsValid(){
  const players = activePlayers();
  if (players.some(p => logState.ui.formScores[p] === '' || isNaN(parseInt(logState.ui.formScores[p], 10)))) return false;
  if (formTotal() !== logState.settings.startPoints * logState.settings.playerCount) return false;
  if (logState.settings.tobiEnabled && logState.settings.tobiRecipient === 'buster') {
    for (const p of players) {
      if ((parseInt(logState.ui.formScores[p], 10) || 0) < 0 && !logState.ui.formBuster[p]) return false;
    }
  }
  return true;
}
function recordHanchan(){
  if (!formIsValid()) return;
  const players = activePlayers();
  const scores = {};
  players.forEach(p => { scores[p] = parseInt(logState.ui.formScores[p], 10); });
  const busterOf = {};
  players.forEach(p => { if (scores[p] < 0 && logState.ui.formBuster[p]) busterOf[p] = logState.ui.formBuster[p]; });

  if (logState.ui.editingHanchanId !== null) {
    const h = logState.hanchans.find(x => x.id === logState.ui.editingHanchanId);
    if (h) { h.scores = scores; h.busterOf = busterOf; }
    logState.ui.editingHanchanId = null;
  } else {
    // この対局で最初の半荘を記録した瞬間の時刻を、あとで履歴に保存する時の
    // startedAtとして使う（既に記録中ならそのまま）。
    if (logState.hanchans.length === 0 && !logState.currentMatchStartedAt) {
      logState.currentMatchStartedAt = new Date().toISOString();
    }
    logState.hanchans.unshift({ id: logState.hanchanSeq++, scores, busterOf });
  }
  logState.ui.confirmEndMatch = false;
  resetFormScores();
  // 演出モード中に新しい半荘を記録したら、対局が続いている証拠なので
  // 発表済みの結果はまた隠しておく（次の「終局」まで再びネタバレしない）。
  if (logState.settings.presentationMode) {
    logState.ui.revealActive = false;
    logState.ui.revealStep = 0;
  }
  saveLogState();
  scheduleRenderApp();
}
function editHanchan(id){
  const h = logState.hanchans.find(x => x.id === id);
  if (!h) return;
  logState.ui.editingHanchanId = id;
  logState.ui.formScores = {};
  logState.ui.formBuster = {};
  activePlayers().forEach(p => {
    logState.ui.formScores[p] = String(h.scores[p] ?? '');
    if (h.busterOf && h.busterOf[p]) logState.ui.formBuster[p] = h.busterOf[p];
  });
  scheduleRenderApp(() => {
    const el = document.getElementById('hanchanFormAnchor');
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
}
function cancelEditHanchan(){
  logState.ui.editingHanchanId = null;
  resetFormScores();
  scheduleRenderApp();
}
function deleteHanchan(id){
  logState.hanchans = logState.hanchans.filter(x => x.id !== id);
  if (logState.ui.editingHanchanId === id) cancelEditHanchan();
  saveLogState();
  scheduleRenderApp();
}
function chipStep(name, delta){
  logState.chips[name] = (logState.chips[name] || 0) + delta;
  saveLogState(); scheduleRenderApp();
}

function renderHanchanForm(){

  const players = activePlayers();

  const expected = s.startPoints * s.playerCount;
  const allFilled = players.every(p => logState.ui.formScores[p] !== '' && !isNaN(parseInt(logState.ui.formScores[p],10)));
  const bustedPlayers = players.filter(p => (parseInt(logState.ui.formScores[p],10)||0) < 0);
  const needsBuster = s.tobiEnabled && s.tobiRecipient === 'buster';
  const busterOk = !needsBuster || bustedPlayers.every(p => logState.ui.formBuster[p]);
  const valid = allFilled && total === expected && busterOk;
  const editing = logState.ui.editingHanchanId !== null;
  // 「第◯半荘」は作成時の連番(id)ではなく、削除後も欠番が出ないよう

  const editingIdx = editing ? logState.hanchans.findIndex(x => x.id === logState.ui.editingHanchanId) : -1;
  const editingDispNum = editingIdx >= 0 ? logState.hanchans.length - editingIdx : '';

  return `
    <section id="hanchanFormAnchor">
      <div class="sec-title">${editing?`第${editingDispNum}半荘を編集中`:'半荘の結果を入力'}<span class="hint">${editing?'':`第${logState.hanchans.length+1}半荘`}</span></div>

// hanchansList/sは対局履歴の詳細画面からも(settingsSnapshotを渡して)再利用できるよう
// パラメータ化してある。opts.readOnly=trueで編集・削除ボタンを非表示にする
// (過去の確定済み対局は書き換えさせない)。
function renderHanchanLog(hanchansList, s, opts){
  opts = opts || {};
  const readOnly = !!opts.readOnly;
  if (hanchansList.length === 0) {
    return `<section><div class="sec-title">対局ログ</div><div class="log-empty">まだ記録がありません</div></section>`;
  }
  // 「第◯半荘」は作成時の連番(id)ではなく、削除しても欠番が出ないよう
  // 現在残っている対局ログの中での順番（一番古いものを1として数え直す）で表示する。
  const cards = hanchansList.map((h, idx)=>{
    const dispNum = hanchansList.length - idx;
    const { pt, ranked } = calcHanchanResult(h, s);
    const rows = [...ranked].sort((a,b)=>a.loRank-b.loRank).map(r=>`
      <div class="hc-row ${r.loRank===1?'rank1':''}">
        <span class="hc-rank">${r.loRank===r.hiRank ? r.loRank : `${r.loRank}-${r.hiRank}`}</span>
        <span class="hc-name">${escapeHtml(r.name)}</span>
        <span class="hc-score">${r.score.toLocaleString()}</span>
        <span class="hc-pt ${pt[r.name]>=0?'plus':'minus'}">${formatPt(pt[r.name])}</span>
      </div>`).join('');
    return `
      <div class="hanchan-card">
        <div class="hc-head">
          <span class="hc-title">第${dispNum}半荘</span>
          ${readOnly ? '' : `<span class="hc-actions">
            <button onclick="editHanchan(${h.id})">✎</button>
            <button onclick="deleteHanchan(${h.id})">×</button>
          </span>`}
        </div>
        <div class="hc-rows">${rows}</div>
      </div>`;
  }).join('');
  return `<section><div class="sec-title">対局ログ<span class="hint">${hanchansList.length}半荘</span></div><div style="display:flex;flex-direction:column;gap:8px;">${cards}</div></section>`;
}

// 演出モード用: 現在の合計収支(円)で順位グループ(同着はまとめる)を作り、
// 「2位→3位→…→1位」の順に並べ替える。同着で複数の順位にまたがる場合は
// そのグループのいちばん良い方の順位（loRank）を発表順の基準にする。
function revealGroupsFor(players, totals, playerCount){
  const entries = players.map(p => ({ name: p, score: Math.round((totals.money[p]||0) * 100) / 100 }));
  const ranked = rankPlayers(entries);
  const order = revealOrderFor(playerCount);
  const seen = new Set();
  const groups = [];
  ranked.forEach(r => {
    const key = `${r.loRank}-${r.hiRank}`;
    if (seen.has(key)) return;
    seen.add(key);
    groups.push({ loRank: r.loRank, hiRank: r.hiRank, members: ranked.filter(x => x.loRank===r.loRank && x.hiRank===r.hiRank) });
  });
  groups.sort((a,b) => order.indexOf(a.loRank) - order.indexOf(b.loRank));
  return groups;
}
function revealGroupCardHtml(group, totals){
  const rankLabel = group.loRank===group.hiRank ? `${group.loRank}位` : `${group.loRank}〜${group.hiRank}位`;
  const isTop = group.loRank === 1;
  return `
    <div class="reveal-card ${isTop?'top':''}">
      <div class="reveal-rank">${isTop?'👑 ':''}${rankLabel}</div>
      ${group.members.map(m => `
        <div class="reveal-member">
          <span class="reveal-name">${escapeHtml(m.name)}</span>
          <span class="reveal-money">${formatMoney(totals.money[m.name])}</span>
          <span class="reveal-pt">${formatPt(totals.pt[m.name])}pt</span>
        </div>`).join('')}
    </div>`;
}

    <div class="mode-switch-row">
      <button class="share-icon-btn" onclick="shareCurrentResult()" title="現在の収支をシェア">📤</button>
      <span class="mode-label">演出モード</span>
      <span class="switch ${presentation?'on':''}" onclick="togglePresentationMode()"></span>
    </div>`;

  if (!presentation) {
    const order = [...players].sort((a,b)=> totals.money[b]-totals.money[a]);
    const topMoney = order.length ? totals.money[order[0]] : 0;
    return `<div class="sticky-header">${modeSwitchHtml}${totalCardsHtml(order, totals, topMoney)}${renderEndMatchControls(false)}</div>`;
  }

  if (!logState.ui.revealActive) {
    return `<div class="sticky-header">${modeSwitchHtml}
      <button class="reveal-btn" onclick="startReveal()">🎤 終局！結果を発表する</button>
    </div>`;
  }

  const groups = revealGroupsFor(players, totals, logState.settings.playerCount);
  const done = logState.ui.revealStep >= groups.length;
  const shownGroups = done ? [...groups].sort((a,b)=>a.loRank-b.loRank) : groups.slice(0, logState.ui.revealStep);

  // 発表中〜発表後は順位カードが積み重なって縦に長くなり得るため、sticky解除
  // (header-block)にして、スクロール時に下のフォームなどを覆い隠さないようにする。
  return `<div class="header-block">${modeSwitchHtml}
    <div class="reveal-area">
      ${shownGroups.map(g => revealGroupCardHtml(g, totals)).join('')}
    </div>
    ${done
      ? `<div class="reveal-done">🎉 発表終了！次の半荘を記録するとまた隠れます</div>${renderEndMatchControls(true)}`
      : `<button class="reveal-btn" onclick="revealNext(${groups.length})">次の順位を発表 →</button>`}
  </div>`;
}

function renderLog(){
  const s = settingsWithPlayers();
  const totals = calcTotals(logState.hanchans, logState.chips, s);
  const headerHtml = renderStickyHeader(s, totals);

  document.getElementById('logTab').innerHTML =
    headerHtml + renderSettingsAccordion() + renderChipsAccordion() + renderHanchanForm() + renderHanchanLog(logState.hanchans, s);
}

function memberKey(names){ return [...names].slice().sort().join('・'); }

function formatMatchDate(startedAt, endedAt){
  const d = new Date(endedAt || startedAt || Date.now());
  if (isNaN(d.getTime())) return '';
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

/* ---- 通算成績 ---- */
// matchHistory中、playerNameが参加していた全対局の全半荘を対象に集計する。
// 「試合数」は半荘数（1半荘あたりの平均収支などと単位を揃えるため）。
function calcCareerStats(matchHistory, playerName){
  const relevant = matchHistory.filter(m => {
    const s = m.settingsSnapshot;
    return s && s.playerNames.slice(0, s.playerCount).includes(playerName);
  });
  if (relevant.length === 0) return null;

  let games = 0, rankSum = 0, top1 = 0, top2 = 0, last = 0, tobiCount = 0, moneySum = 0, maxScore = -Infinity;
  relevant.forEach(m => {
    const s = m.settingsSnapshot;
    const players = s.playerNames.slice(0, s.playerCount);
    const settingsForCalc = { ...s, players };
    m.hanchans.forEach(h => {
      if (!(playerName in h.scores)) return;
      games++;
      const entries = players.map(p => ({ name: p, score: h.scores[p] }));
      const ranked = rankPlayers(entries);
      const me = ranked.find(r => r.name === playerName);
      rankSum += (me.loRank + me.hiRank) / 2; // 同着は帯の平均順位として数える
      if (me.loRank === 1) top1++;
      if (me.hiRank <= 2) top2++;
      if (me.hiRank === s.playerCount) last++;
      if (h.scores[playerName] < 0) tobiCount++;
      if (h.scores[playerName] > maxScore) maxScore = h.scores[playerName];
      const { pt } = calcHanchanResult(h, settingsForCalc);
      moneySum += pt[playerName] * s.rate;
    });
    moneySum += ((m.chips && m.chips[playerName]) || 0) * s.chipUnitYen;
  });
  if (games === 0) return null;

  return {
    games,
    avgRank: rankSum / games,
    topRate: top1 / games,
    top2Rate: top2 / games,     // 連対率（4人打ち用）
    lastRate: last / games,
    lastAvoidRate: 1 - (last / games), // ラス回避率（3人打ち用）
    maxScore: maxScore === -Infinity ? 0 : maxScore,
    avgMoneyPerHanchan: moneySum / games,
    totalMoney: moneySum,
    tobiCount,
  };
}

function renderHistoryStats(){
  if (logState.matchHistory.length === 0) {
    return `<div class="history-empty">まだ成績データがありません<br>対局を終了すると、ここに通算成績が表示されます</div>`;
  }
  // メンバー構成（参加者の名前の組み合わせ）ごとにグループ分けする。
  const groups = {};
  logState.matchHistory.forEach(m => {
    const s = m.settingsSnapshot;
    const players = s.playerNames.slice(0, s.playerCount);
    const key = memberKey(players);
    if (!groups[key]) groups[key] = { players, playerCount: s.playerCount, matches: [] };
    groups[key].matches.push(m);
  });
  const groupList = Object.values(groups).sort((a,b) => b.matches.length - a.matches.length);

  return groupList.map(g => {
    const totalHanchans = g.matches.reduce((sum,m)=>sum+m.hanchans.length, 0);
    const cards = g.players.map(p => {
      const st = calcCareerStats(g.matches, p);
      if (!st) return '';
      const primaryLine = g.playerCount === 4
        ? `<div class="stat-row">連対率 <b>${(st.top2Rate*100).toFixed(0)}%</b></div>`
        : `<div class="stat-row">トップ率 <b>${(st.topRate*100).toFixed(0)}%</b> ／ ラス回避率 <b>${(st.lastAvoidRate*100).toFixed(0)}%</b></div>`;
      const secondaryLine = g.playerCount === 4
        ? `<div class="stat-row">トップ率 <b>${(st.topRate*100).toFixed(0)}%</b> ／ ラス率 <b>${(st.lastRate*100).toFixed(0)}%</b></div>`
        : `<div class="stat-row">ラス率 <b>${(st.lastRate*100).toFixed(0)}%</b></div>`;
      const moneyColor = v => v >= 0 ? '#9fe0bd' : 'var(--red-soft)';
      return `
        <div class="stat-card">
          <div class="stat-name">${escapeHtml(p)}</div>
          <div class="stat-row">平均順位 <b>${st.avgRank.toFixed(2)}</b></div>
          <div class="stat-row">試合数 <b>${st.games}半荘</b></div>
          ${primaryLine}
          ${secondaryLine}
          <div class="stat-row">MAX得点 <b>${st.maxScore.toLocaleString()}</b></div>
          <div class="stat-row">飛んだ回数 <b>${st.tobiCount}回</b></div>
          <div class="stat-row">平均収支(半荘あたり) <b style="color:${moneyColor(st.avgMoneyPerHanchan)}">${formatMoney(st.avgMoneyPerHanchan)}</b></div>
          <div class="stat-row">通算収支 <b style="color:${moneyColor(st.totalMoney)}">${formatMoney(st.totalMoney)}</b></div>
        </div>`;
    }).join('');
    return `
      <div class="stat-group">
        <div class="stat-group-head"><span>${escapeHtml(g.players.join('・'))}</span><span class="hint">${g.matches.length}対局・${totalHanchans}半荘</span></div>
        <div class="stat-cards">${cards}</div>
      </div>`;
  }).join('');
}

/* ---- エクスポート / インポート / シェア ---- */
async function exportMatchHistory(includeInProgress){
  const payload = {
    exportedAt: new Date().toISOString(),
    appVersion: 'mahjong-score-log-v2',
    matchHistory: logState.matchHistory,
  };
  if (includeInProgress && logState.hanchans.length > 0) {
    payload.inProgress = {
      settings: logState.settings,
      hanchans: logState.hanchans,
      chips: logState.chips,
      startedAt: logState.currentMatchStartedAt,
    };
  }
  const json = JSON.stringify(payload, null, 2);
  const filename = `mahjong-log-${new Date().toISOString().slice(0,10)}.json`;
  const blob = new Blob([json], { type: 'application/json' });

  if (navigator.share && navigator.canShare) {
    try {
      const file = new File([blob], filename, { type: 'application/json' });
      if (navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: '麻雀対局履歴' });
        return;
      }
    } catch (e) { /* キャンセル・失敗時は下のダウンロードにフォールバック */ }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function triggerImport(){
  const el = document.getElementById('importFileInput');
  if (el) el.click();
}
function handleImportFile(files){
  const file = files && files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      const incoming = Array.isArray(data.matchHistory) ? data.matchHistory
        : Array.isArray(data) ? data : [];
      const existingIds = new Set(logState.matchHistory.map(m => m.id));
      let added = 0, skipped = 0;
      incoming.forEach(m => {
        if (!m || !m.id || !m.settingsSnapshot || !Array.isArray(m.hanchans)) { skipped++; return; }
        if (existingIds.has(m.id)) { skipped++; return; }
        existingIds.add(m.id);
        logState.matchHistory.push(m);
        added++;
      });
      logState.matchHistory.sort((a,b) => new Date(b.endedAt||b.startedAt||0) - new Date(a.endedAt||a.startedAt||0));
      saveLogState();
      logState.ui.importResultMsg = `${added}件を読み込みました${skipped>0?`（${skipped}件は重複・不正な形式のためスキップ）`:''}`;
    } catch (e) {
      logState.ui.importResultMsg = '読み込みに失敗しました。ファイル形式を確認してください。';
    }
    scheduleRenderApp();
  };
  reader.readAsText(file);
  const el = document.getElementById('importFileInput');
  if (el) el.value = '';
}

function buildShareText(players, totals, headerLine){
  const order = [...players].sort((a,b)=>totals.money[b]-totals.money[a]);
  const lines = order.map((p,i) => `${i+1}位 ${p}　${formatMoney(totals.money[p])}`);
  return `${headerLine ? headerLine + '\n\n' : ''}${lines.join('\n')}`;
}
async function shareText(text, title){
  if (navigator.share) {
    try {
      await navigator.share({ text, title: title || '麻雀対局結果' });
      return;
    } catch (e) { /* キャンセル・未対応時は下のフォールバックへ */ }
  }
  try {
    await navigator.clipboard.writeText(text);
    logState.ui.shareFallbackMsg = 'クリップボードにコピーしました';
  } catch (e) {
    logState.ui.shareFallbackMsg = text; // コピーもできない環境ではテキストをそのまま表示する
  }
  scheduleRenderApp();
  setTimeout(() => { logState.ui.shareFallbackMsg = null; scheduleRenderApp(); }, 4000);
}
function shareCurrentResult(){
  const s = settingsWithPlayers();
  const totals = calcTotals(logState.hanchans, logState.chips, s);
  const order = [...s.players].sort((a,b)=>totals.money[b]-totals.money[a]);
  const header = order.length ? `🀄 現在${order[0]}さんがトップ！収支${formatMoney(totals.money[order[0]])}` : '';
  shareText(buildShareText(s.players, totals, header));
}
function shareMatchResult(id){
  const m = logState.matchHistory.find(x => x.id === id);
  if (!m) return;
  const s = m.settingsSnapshot;
  const players = s.playerNames.slice(0, s.playerCount);
  const totals = calcTotals(m.hanchans, m.chips, { ...s, players });
  const order = [...players].sort((a,b)=>totals.money[b]-totals.money[a]);
  const header = order.length ? `🀄 ${order[0]}さん第1位！収支${formatMoney(totals.money[order[0]])}` : '';
  shareText(buildShareText(players, totals, header));
}

      <div class="history-toolbar">

        <button class="mentsu-add" onclick="triggerImport()">⬆ インポート</button>
      </div>
      ${renderHistoryList()}

/* ---- top-level bootstrap ---- */
// テキスト入力のonchange（blur）と、別のボタンへのタップは同じ一連の操作の中で
// 同期的に発火する。renderApp()をその場で同期実行すると、タップ先のボタンごと
// DOMを作り直してしまい、直後に来るはずのクリックイベントが宛先を失って
// 消えてしまう（＝名前変更などの直後だけ他の項目が反応しなくなる不具合の原因）。
// 1フレーム分だけ描画を遅らせることで、先に来ているクリックを本来のボタンで
// 処理させてから、最新のstateで安全に描画し直す。
let _renderAppQueued = false;
let _renderAppCallbacks = [];
function scheduleRenderApp(afterRender){
  if (afterRender) _renderAppCallbacks.push(afterRender);
  if (_renderAppQueued) return;
  _renderAppQueued = true;
  requestAnimationFrame(() => {
    _renderAppQueued = false;
    renderApp();
    const cbs = _renderAppCallbacks.splice(0);
    cbs.forEach(cb => cb());
  });
}
function renderApp(){
  const onLog = logState._activeTab === 'log';
  document.getElementById('appTitle').innerHTML = onLog
    ? '<span class="tile">🀄</span>得点記録票'
    : '<span class="tile">🀄</span>麻雀点数電卓';
  document.getElementById('calcTab').style.display = onLog ? 'none' : '';
  document.getElementById('logTab').style.display = onLog ? '' : 'none';
  // 対局履歴(☰)は得点記録票タブでのみ意味を持つので、それ以外では隠す。
  document.getElementById('historyMenuBtn').style.display = onLog ? '' : 'none';
  if (!onLog) logState.ui.historyOpen = false; // 計算タブに切り替えたらモーダルも閉じる
  document.getElementById('bottomNav').innerHTML = `
    <button class="${onLog?'':'active'}" onclick="setActiveTab('calc')"><span class="ic">🀄</span>点数計算</button>
    <button class="${onLog?'active':''}" onclick="setActiveTab('log')"><span class="ic">📋</span>得点記録</button>
  `;
  if (onLog) renderLog(); else render();
  renderHistoryModal();
}

renderApp();
